name: Banksight
description: >-
  BankSight Systems is a cloud banking software company founded in 2015 (San
  Francisco / Mumbai) that built an intelligent banking CRM and customer
  engagement platform for community banks, regional banks, and credit unions.
  The platform consolidated and analyzed customer data on top of Microsoft
  Azure and the Microsoft Power Platform, running a banking-specific data model
  with an open integration framework of pre-built connectors to core, LOS, and
  legacy banking systems, and delivered AI-driven "Next Best Conversation"
  recommendations to bankers and wealth managers. BankSight was acquired by
  Bottomline Technologies; its product now lives inside Bottomline's Commercial
  Digital Banking platform, and banksight.com 301-redirects to bottomline.com.
  This profile was surfaced as a Bloomberg Beta portfolio company (since exited)
  and added to the API Evangelist network for enrichment.
